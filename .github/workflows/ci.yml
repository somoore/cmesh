name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect markdown-only change
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: echo "markdown_only=$(sh scripts/markdown-only-change.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.changes.outputs.markdown_only != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        if: steps.changes.outputs.markdown_only != 'true'
        run: make test

      - name: Skip markdown-only change
        if: steps.changes.outputs.markdown_only == 'true'
        run: echo "Skipping Go tests for markdown-only change"
