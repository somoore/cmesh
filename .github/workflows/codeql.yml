name: codeql

on:
  push:
    branches:
      - main
  pull_request_target:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect markdown-only change
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          markdown_only=false

          check_path() {
            local path=$1
            if [[ "$path" != *.md ]]; then
              markdown_only=false
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            any=false
            markdown_only=true
            while IFS=$'\t' read -r status filename previous_filename; do
              any=true
              check_path "$filename"
              if [ -n "${previous_filename:-}" ]; then
                check_path "$previous_filename"
              fi
            done < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv'
            )
            if [ "$any" != true ]; then
              markdown_only=false
            fi
          elif [ "${{ github.event_name }}" != "schedule" ] && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              if git rev-parse -q --verify "$head^" >/dev/null; then
                base="$head^"
              else
                echo "markdown_only=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            any=false
            markdown_only=true
            while IFS= read -r -d '' status; do
              any=true
              paths=()
              case "$status" in
                R*|C*)
                  IFS= read -r -d '' old_path
                  IFS= read -r -d '' new_path
                  paths=("$old_path" "$new_path")
                  ;;
                *)
                  IFS= read -r -d '' path
                  paths=("$path")
                  ;;
              esac
              for path in "${paths[@]}"; do
                check_path "$path"
              done
            done < <(git diff --name-status -z -M -C "$base" "$head")

            if [ "$any" != true ]; then
              markdown_only=false
            fi
          fi
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: steps.changes.outputs.markdown_only != 'true'
        uses: github/codeql-action/init@96a56f9e1619f4ee5970aabb968dc392d1e9b425
        with:
          languages: go

      - name: Autobuild
        if: steps.changes.outputs.markdown_only != 'true'
        uses: github/codeql-action/autobuild@96a56f9e1619f4ee5970aabb968dc392d1e9b425

      - name: Analyze
        if: steps.changes.outputs.markdown_only != 'true'
        uses: github/codeql-action/analyze@96a56f9e1619f4ee5970aabb968dc392d1e9b425
        with:
          upload: false

      - name: Skip markdown-only change
        if: steps.changes.outputs.markdown_only == 'true'
        run: echo "Skipping CodeQL for markdown-only change"
