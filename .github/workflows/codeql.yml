name: codeql

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@96a56f9e1619f4ee5970aabb968dc392d1e9b425
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@96a56f9e1619f4ee5970aabb968dc392d1e9b425

      - name: Analyze
        uses: github/codeql-action/analyze@96a56f9e1619f4ee5970aabb968dc392d1e9b425
