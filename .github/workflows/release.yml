name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release-ref.outputs.tag_name }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate signed tag
        id: release-ref
        env:
          RELEASE_SSH_ALLOWED_SIGNERS: ${{ secrets.RELEASE_SSH_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [ -z "${RELEASE_SSH_ALLOWED_SIGNERS:-}" ]; then
            echo "::error::Missing required secret: RELEASE_SSH_ALLOWED_SIGNERS"
            exit 1
          fi
          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "::error::Release tag must start with v, got: $TAG_NAME"
              exit 1
              ;;
          esac
          allowed_signers="$RUNNER_TEMP/cmesh-release-allowed-signers"
          printf '%s\n' "$RELEASE_SSH_ALLOWED_SIGNERS" > "$allowed_signers"
          git config --global gpg.format ssh
          git config --global gpg.ssh.allowedSignersFile "$allowed_signers"
          git fetch --force origin main:refs/remotes/origin/main --tags
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "::error::Release ref is not an existing tag: $TAG_NAME"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/$TAG_NAME")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::Checked-out commit does not match $TAG_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "::error::$TAG_NAME must point to a commit reachable from origin/main"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG_NAME")" != "tag" ]; then
            echo "::error::$TAG_NAME must be an annotated, signed tag"
            exit 1
          fi
          git verify-tag "$TAG_NAME"

  test:
    name: test
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ needs.validate.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  build-portable:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    needs:
      - validate
      - test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ needs.validate.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          CMESH_PLATFORMS: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: make build VERSION="${{ needs.validate.outputs.tag_name }}"

      - name: Upload archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-cmesh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cmesh_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: build, sign, notarize darwin/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - validate
      - test
    permissions:
      contents: read
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: macos-15-intel
          - goarch: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ needs.validate.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate macOS signing secrets
        env:
          APP_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APP_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_SIGN_IDENTITY APP_P12 APP_P12_PASSWORD APPLE_KEY_ID APPLE_ISSUER_ID APPLE_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID Application certificate
        env:
          APP_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/cmesh-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          APP_P12_PATH="$RUNNER_TEMP/developer-id-application.p12"

          printf '%s' "$APP_P12" | base64 -D > "$APP_P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_P12_PATH" -k "$KEYCHAIN_PATH" -P "$APP_P12_PASSWORD" -t cert -f pkcs12 -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$APP_P12_PATH"

      - name: Decode notarization key
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_KEY_P8" | base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_KEY_ID}.p8"

      - name: Build signed archive
        env:
          CMESH_PLATFORMS: darwin/${{ matrix.goarch }}
          CMESH_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: make build VERSION="${{ needs.validate.outputs.tag_name }}"

      - name: Notarize archive
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          artifact="dist/cmesh_darwin_${{ matrix.goarch }}.tar.gz"
          workdir="$RUNNER_TEMP/cmesh-notary-${{ matrix.goarch }}"
          zip="$RUNNER_TEMP/cmesh-darwin-${{ matrix.goarch }}-notary.zip"
          mkdir -p "$workdir"
          tar -xzf "$artifact" -C "$workdir"
          codesign --verify --strict --verbose=2 "$workdir/cmesh"
          ditto -c -k --sequesterRsrc --keepParent "$workdir/cmesh" "$zip"
          xcrun notarytool submit "$zip" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_KEY_ID}.p8" \
            --key-id "$APPLE_KEY_ID" \
            --issuer "$APPLE_ISSUER_ID" \
            --wait

      - name: Upload archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-cmesh-darwin-${{ matrix.goarch }}
          path: dist/cmesh_darwin_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  publish:
    name: sign artifacts and publish release
    runs-on: ubuntu-24.04
    needs:
      - validate
      - build-portable
      - build-macos
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ needs.validate.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Download archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: release-cmesh-*
          path: dist
          merge-multiple: true

      - name: Generate SBOMs
        run: make sbom

      - name: Generate release notes
        run: make release-notes VERSION="${{ needs.validate.outputs.tag_name }}"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f \( \
              -name '*.tar.gz' -o \
              -name '*.sbom.cdx.json' -o \
              -name 'release-notes.md' \
            \) -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          )
          cat dist/checksums.txt

      - name: Sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: make sign

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.validate.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ needs.validate.outputs.tag_name }} already exists; refusing to overwrite artifacts"
            exit 1
          fi
          gh release create "${{ needs.validate.outputs.tag_name }}" dist/* \
            --verify-tag \
            --title "${{ needs.validate.outputs.tag_name }}" \
            --notes-file dist/release-notes.md
