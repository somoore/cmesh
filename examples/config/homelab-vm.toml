[node]
id = "homelab-vm"
name = "homelab-vm"
mesh_port = 7778
mcp_port = 7777
data_dir = "~/.local/share/cmesh"

[tailscale]
mode = "host"
bind = "tailnet_ip"

# Allowlists key on the matchable hostname (Tailscale whois NodeName, the first
# DNS label), not an ephemeral tailscale node id. Use the peer's hostname here
# and in peers.<x>.node_id below so inbound policy can match the caller.
[policy]
allowed_peers = ["mac-studio"]
allowed_cwds = ["~/code/**", "~/builds/**"]
hop_limit = 2

[policy.outbound]
allowed_peers = ["mac-studio"]
denied_profiles = ["yolo"]
allow_subdelegation = false

# query is the safe default: built-in deterministic probes on the "probe" runner,
# with no shell, no writes, and no arbitrary agent execution. This is the profile
# a caller gets unless they explicitly name a higher-authority one.
[profiles.query]
runner = "probe"
description = "Deterministic read-only machine queries. No shell, no writes, no arbitrary agent."
capabilities = ["disk_info", "system_info", "memory_info", "uptime", "repo_status", "process_list"]
writes = "deny"
shell = "deny"
risk = "low"
max_runtime = "30s"

# repo-dev is agent authority for repo work: edits, builds, and tests inside an
# allowed cwd. It is available but NOT the default — being high-risk, a caller
# must request it by name (profile: "repo-dev") and hold an acknowledged lease.
# Grant it only to peers you trust.
[profiles.repo-dev]
runner = "claude-code"
description = "Agent-assisted repo-local edits and test commands inside allowed cwd."
capabilities = ["read_files", "edit_repo", "execute_in_repo"]
writes = "repo_only"
shell = "allow"
network = false
git_push = false
require_explicit = true
require_lease = true
risk = "high"
max_runtime = "2h"

# The built-in probe runner backs the query profile. It runs cmesh's own
# deterministic probes — no external agent — and is the node's default.
[runners.probe]
command = ["builtin"]
default_profile = "query"
concurrency = 1

[runners.claude-code]
command = ["claude", "-p"]
default_profile = "repo-dev"
manifest_path = "~/.config/cmesh/manifests/claude-code.runner_manifest.v1.json"
concurrency = 1

[peers.mac-studio]
name = "mac-studio"
# Matchable hostname (whois NodeName), not an ephemeral tailscale node id.
node_id = "mac-studio"
address = "100.64.10.10"
port = 7778
